name: Apply VX2 step detection fix

on:
  push:
    branches:
      - dev/voxstrike-2.0

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make floor probing lead collision radius
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/vertical-slice/greenfield-v3.js')
          s = p.read_text()
          old = "floorAt(nx,nz,entity.pos.y,step,Math.max(.18,radius-.04))"
          new = "floorAt(nx,nz,entity.pos.y,step,radius+.03)"
          if new not in s:
            if old not in s:
              raise SystemExit('step probe anchor not found')
            p.write_text(s.replace(old, new, 1))
      - name: Commit source fix if needed
        run: |
          if git diff --quiet -- src/vertical-slice/greenfield-v3.js; then
            echo "Step fix already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vertical-slice/greenfield-v3.js
          git commit -m "fix(vx2): probe steps before collision contact"
          git push
