name: Add VX2 QA debug bridge

on:
  push:
    branches:
      - dev/voxstrike-2.0

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add query-gated QA bridge
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path('src/vertical-slice/greenfield-v3.js')
          s = p.read_text()
          anchor = "const bots=Array.from({length:6},(_,i)=>makeBot(i));\n"
          encoded = ""
          bridge = base64.b64decode(encoded).decode()
          if 'window.__VX2_QA__' not in s:
              if anchor not in s:
                  raise SystemExit('bot anchor not found')
              p.write_text(s.replace(anchor, anchor + bridge, 1))

      - name: Commit QA bridge if needed
        run: |
          if git diff --quiet -- src/vertical-slice/greenfield-v3.js; then
            echo "QA bridge already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vertical-slice/greenfield-v3.js
          git commit -m "test(vx2): expose query-gated gameplay QA bridge"
          git push
