name: VOXSTRIKE 2.0 Build

on:
  push:
    branches:
      - dev/voxstrike-2.0
      - main
  pull_request:
    paths:
      - 'index.html'
      - 'classic.html'
      - 'vx2.html'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - 'vite.config.js'
      - 'vercel.json'
      - '.github/workflows/vx2-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build release and classic fallback
        run: npm run build

      - name: Verify entry points and PWA files
        run: |
          test -f dist/index.html
          test -f dist/classic.html
          test -f dist/vx2.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          test -f dist/icon.svg

      - name: Verify VX2 combat assets
        run: |
          test "$(find dist -type f -name '*.glb' | wc -l)" -ge 3
          test "$(find dist -type f -name '*.ogg' | wc -l)" -ge 6
          grep -R "GREENFIELD" dist/index.html dist/vx2.html dist/assets >/dev/null

      - name: Upload tested Slice 03 source
        uses: actions/upload-artifact@v4
        with:
          name: voxstrike-vx2-tested-source
          path: src/vertical-slice/greenfield-v3.js
          if-no-files-found: error
          retention-days: 7

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Greenfield browser gate
        run: npm run test:e2e

      - name: Upload browser-playtest build
        uses: actions/upload-artifact@v4
        with:
          name: voxstrike-vx2-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxstrike-vx2-browser-qa
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
