name: Apply VX2 release source fixes

on:
  push:
    branches:
      - dev/voxstrike-2.0

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch traversal and cover behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/vertical-slice/greenfield-v3.js')
          s = p.read_text()

          old = "function floorAt(x,z,currentY,maxRise=.6){ let floor=0; for(const c of colliders){ if(!c.walkable||!overlapsXZ(c,x,z,.18))continue; if(c.maxY<=currentY+maxRise&&c.maxY>floor)floor=c.maxY; } return floor; }"
          new = "function floorAt(x,z,currentY,maxRise=.6,radius=.18){ let floor=0; for(const c of colliders){ if(!c.walkable||!overlapsXZ(c,x,z,radius))continue; if(c.maxY<=currentY+maxRise&&c.maxY>floor)floor=c.maxY; } return floor; }"
          if old in s:
              s = s.replace(old, new, 1)

          old = "const f=floorAt(nx,nz,entity.pos.y,step);"
          new = "const f=floorAt(nx,nz,entity.pos.y,step,Math.max(.18,radius-.04));"
          if old in s:
              s = s.replace(old, new, 1)

          old = "function pathReachable(from,to){ const dist=from.distanceTo(to),steps=Math.max(2,Math.ceil(dist/3)); for(let i=1;i<=steps;i++){const t=i/steps,x=THREE.MathUtils.lerp(from.x,to.x,t),z=THREE.MathUtils.lerp(from.z,to.z,t);if(!canOccupyGround(x,z,.48))return false;} return true; }"
          new = "function pathReachable(from,to){ const dist=from.distanceTo(to),steps=Math.max(2,Math.ceil(dist/2.4));let y=from.y||0;for(let i=1;i<=steps;i++){const t=i/steps,x=THREE.MathUtils.lerp(from.x,to.x,t),z=THREE.MathUtils.lerp(from.z,to.z,t),f=floorAt(x,z,y,.56,.44);if(f-y>.56||f-y<-.5||blockedAt(x,z,f,1.86,.44))return false;y=f;}return true; }"
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace("!lineOfSight(node.clone().setY(node.y+1.45),p.clone().setY(p.y+1.45))", "!lineOfSight(node.clone().setY(node.y+.92),p.clone().setY(p.y+1.45))")
          s = s.replace("!lineOfSight(n.clone().setY(n.y+1.45),p.clone().setY(p.y+1.45))", "!lineOfSight(n.clone().setY(n.y+.92),p.clone().setY(p.y+1.45))")

          old = "bot.group.position.copy(bot.pos);bot.group.rotation.y=Math.atan2(player.pos.x-bot.pos.x,player.pos.z-bot.pos.z);bot.shootCd-=dt;"
          new = "bot.group.position.set(bot.pos.x,bot.pos.y+(atCover&&!bot.peekOut?-.48:0),bot.pos.z);bot.group.rotation.y=Math.atan2(player.pos.x-bot.pos.x,player.pos.z-bot.pos.z);bot.shootCd-=dt;"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit release fixes if needed
        run: |
          if git diff --quiet -- src/vertical-slice/greenfield-v3.js; then
            echo "Release source fixes already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vertical-slice/greenfield-v3.js
          git commit -m "fix(vx2): make stairs and low cover physically usable"
          git push
