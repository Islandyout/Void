name: Apply VX2 QA source fixes

on:
  push:
    branches:
      - dev/voxstrike-2.0

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply verified Slice 03 QA fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/vertical-slice/greenfield-v3.js')
          s = p.read_text()

          stair = "  for(let i=0;i<6;i++) addBox(cx+8.7,cz+6.4-i*1.15,2.4,.42*(i+1),1.1,0x7f6b54,0,{tag:'stairs'});\n"
          bridge = "  addBox(cx+4,cz+.65,9.5,.28,3.2,floor,2.55,{metalness:.12,tag:'mezzanine-bridge'});\n"
          if 'mezzanine-bridge' not in s:
              if stair not in s: raise SystemExit('warehouse stair anchor not found')
              s = s.replace(stair, stair + bridge, 1)

          old_step = "moveEntity(bot,dir.x*speed*dt,dir.z*speed*dt,.46,1.86,.35);"
          if old_step in s:
              s = s.replace(old_step, "moveEntity(bot,dir.x*speed*dt,dir.z*speed*dt,.46,1.86,.52);", 1)

          old_respawn = "function respawnPlayer(){player.pos.copy(randomSpawn(new THREE.Vector3(),0));player.vel.set(0,0,0);player.hp=100;player.alive=true;player.grounded=true;player.crouched=false;player.slideT=0;player.mantleT=0;death.classList.add('hidden');updateHud();if(!coarse&&running)canvas.requestPointerLock();}"
          new_respawn = "function respawnPlayer(){player.pos.copy(randomSpawn(new THREE.Vector3(),0));player.vel.set(0,0,0);player.hp=100;player.alive=true;player.grounded=true;player.eye=1.72;player.crouched=false;player.slideT=0;player.mantleT=0;switchT=0;reloading=false;reloadT=0;cooldown=0;input.fire=false;input.firePressed=false;input.ads=false;input.crouchHold=false;input.crouchToggle=false;input.crouchPressed=false;ads=0;feel.cancelActions();death.classList.add('hidden');updateHud();if(!coarse&&running)canvas.requestPointerLock();}"
          if old_respawn in s:
              s = s.replace(old_respawn, new_respawn, 1)

          old_reset = "function resetMatch(){matchTime=300;kills=0;score=0;deaths=0;for(const id of WEAPON_ORDER){ammo[id].mag=WEAPONS[id].magSize;ammo[id].reserve=WEAPONS[id].reserve;}currentWeapon='carbine';switchT=0;reloading=false;feel.cancelActions();for(const b of bots)respawnBot(b);respawnPlayer();loadWeaponModel(currentWeapon);updateHud();}"
          new_reset = "function resetMatch(){matchTime=300;kills=0;score=0;deaths=0;for(const id of WEAPON_ORDER){ammo[id].mag=WEAPONS[id].magSize;ammo[id].reserve=WEAPONS[id].reserve;}currentWeapon='carbine';switchT=0;reloading=false;feel.cancelActions();respawnPlayer();for(const b of bots)respawnBot(b);loadWeaponModel(currentWeapon);updateHud();}"
          if old_reset in s:
              s = s.replace(old_reset, new_reset, 1)

          p.write_text(s)

      - name: Commit source fixes if needed
        run: |
          if git diff --quiet -- src/vertical-slice/greenfield-v3.js; then
            echo "Source already contains QA fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vertical-slice/greenfield-v3.js
          git commit -m "fix(vx2): harden spawn and vertical traversal"
          git push
