name: Apply VX2 warehouse stair fix

on:
  push:
    branches:
      - dev/voxstrike-2.0

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Move mezzanine bridge clear of lower stair headroom
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/vertical-slice/greenfield-v3.js')
          s = p.read_text()
          old = "addBox(cx+4,cz+.65,9.5,.28,3.2,floor,2.55,{metalness:.12,tag:'mezzanine-bridge'});"
          new = "addBox(cx+4,cz-1.2,9.5,.28,3.2,floor,2.55,{metalness:.12,tag:'mezzanine-bridge'});"
          if new not in s:
            if old not in s:
              raise SystemExit('mezzanine bridge anchor not found')
            p.write_text(s.replace(old, new, 1))
      - name: Commit source fix if needed
        run: |
          if git diff --quiet -- src/vertical-slice/greenfield-v3.js; then
            echo "Stair fix already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vertical-slice/greenfield-v3.js
          git commit -m "fix(vx2): clear warehouse stair headroom"
          git push
